name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend/yolo-plate-webApp

jobs:
  quality:
    name: Lint, validate & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/yolo-plate-webApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate samples manifest
        run: npm run validate:samples

      - name: Build
        run: npm run build

      - name: Verify production output
        run: |
          test -f dist/index.html
          test -f dist/models/best.onnx
          test -f dist/samples/samples.json
